<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 136" width="100%" height="100%">
  <defs>
    <!-- Gradiente Cósmico Oficial Sooniverse -->
    <linearGradient id="cosmicGradNavbar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="50%" stop-color="#60EFFF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>

    <!-- Gradiente del Planeta de Alta Visibilidad -->
    <linearGradient id="planetGradNavbar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Filtros de Brillo Activo para Nodos -->
    <filter id="neonGlowNavbar" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Máscara con efecto de máquina de escribir / barrido -->
    <mask id="typewriterMask">
      <rect id="maskRect" x="0" y="-70" width="0" height="90" fill="#FFFFFF" />
    </mask>

    <style>
      /* Entrada y flotación del Planeta */
      .planet-group {
        transform-origin: 120px 65px;
        animation: planetEntry 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                   planetFloat 3.5s ease-in-out 1.2s infinite alternate;
      }

      /* Animación de los Nodos (latido / glow) */
      .node-pulse {
        animation: pulseGlow 1.8s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .node-delay-1 { animation-delay: 0.3s; }
      .node-delay-2 { animation-delay: 0.6s; }

      /* Animación de Escritura del Texto */
      #maskRect {
        animation: writeText 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
      }

      /* --- ACTUALIZADO: Cursor brillante --- */
      .cursor-line {
        /* Se mueve con el texto y se mantiene visible */
        animation: moveCursor 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards,
                   /* Después de 2.8s (0.6s delay + 2.2s move), parpadea y DESAPARECE */
                   blinkAndDissolve 0.7s ease-in-out 2.8s forwards; 
        opacity: 0; /* Empieza invisible hasta que empieza a moverse */
      }

      @keyframes planetEntry {
        0% { transform: translate(120px, 65px) scale(0.3); opacity: 0; }
        100% { transform: translate(120px, 65px) scale(1); opacity: 1; }
      }

      @keyframes planetFloat {
        0% { transform: translate(120px, 65px) translateY(0px) rotate(0deg); }
        100% { transform: translate(120px, 65px) translateY(-5px) rotate(2deg); }
      }

      @keyframes pulseGlow {
        0% { transform: scale(0.85); opacity: 0.7; }
        100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #60EFFF); }
      }

      @keyframes writeText {
        0% { width: 0px; }
        100% { width: 380px; }
      }

      /* --- ACTUALIZADO: Movimiento del Cursor --- */
      @keyframes moveCursor {
        0% { transform: translateX(0px); opacity: 0; }
        1% { opacity: 1; } /* Aparece justo al empezar */
        100% { transform: translateX(340px); opacity: 1; } /* Se mantiene visible al final del movimiento */
      }

      /* --- NUEVO: Parpadeo final y desaparición completa --- */
      @keyframes blinkAndDissolve {
        0% { opacity: 1; }
        25% { opacity: 0; }
        50% { opacity: 1; }
        75% { opacity: 0; }
        100% { opacity: 0; } /* Se queda invisible */
      }
    </style>
  </defs>

  <!-- ================= ISOTIPO: PLANETA SATURNO ================= -->
  <g class="planet-group">
    <!-- Anillos Traseros -->
    <g transform="rotate(-18)">
      <path d="M -68,0 A 68,19 0 0,1 68,0" fill="none" stroke="url(#cosmicGradNavbar)" stroke-width="2.5" opacity="0.35"/>
      <path d="M -92,0 A 92,26 0 0,1 92,0" fill="none" stroke="url(#cosmicGradNavbar)" stroke-width="11" opacity="0.4"/>
      <path d="M -92,0 A 92,26 0 0,1 92,0" fill="none" stroke="#60EFFF" stroke-width="2" opacity="0.6"/>
      <path d="M -114,0 A 114,32 0 0,1 114,0" fill="none" stroke="url(#cosmicGradNavbar)" stroke-width="3.5" opacity="0.3"/>
    </g>
    
    <!-- Cuerpo del Planeta -->
    <circle cx="0" cy="0" r="46" fill="url(#planetGradNavbar)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M -40,-22 Q 0,-10 40,-22" fill="none" stroke="#60EFFF" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M -45,12 Q 0,26 45,12" fill="none" stroke="#00FF87" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M -46,0 Q 0,14 46,0" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 3"/>

    <!-- Anillos Delanteros Protagonistas -->
    <g transform="rotate(-18)">
      <path d="M 68,0 A 68,19 0 0,1 -68,0" fill="none" stroke="url(#cosmicGradNavbar)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 92,0 A 92,26 0 0,1 -92,0" fill="none" stroke="url(#cosmicGradNavbar)" stroke-width="11" stroke-linecap="round"/>
      <path d="M 92,0 A 92,26 0 0,1 -92,0" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" stroke-linecap="round"/>
      <path d="M 114,0 A 114,32 0 0,1 -114,0" fill="none" stroke="url(#cosmicGradNavbar)" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Nodos Orbitales Animados -->
    <circle class="node-pulse" cx="-80" cy="-45" r="9" fill="#00FF87" filter="url(#neonGlowNavbar)"/>
    <circle cx="-80" cy="-45" r="4" fill="#FFFFFF"/>
    
    <circle class="node-pulse node-delay-1" cx="104" cy="12" r="7.5" fill="#60EFFF" filter="url(#neonGlowNavbar)"/>
    
    <circle class="node-pulse node-delay-2" cx="15" cy="58" r="8.5" fill="#8A2BE2" filter="url(#neonGlowNavbar)"/>
    <circle cx="15" cy="58" r="3" fill="#60EFFF"/>
  </g>

  <!-- ================= TEXTO: SOONIVERSE (Con animación de escritura) ================= -->
  <g transform="translate(252, 86)">
    <!-- Texto enmascarado -->
    <g mask="url(#typewriterMask)">
      <text x="0" y="0" font-family="'Inter', '-apple-system', sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-2px">
        Sooni<tspan fill="url(#cosmicGradNavbar)">verse</tspan>
      </text>
    </g>
    
    <!-- Cursor cósmico que escribe el texto -->
    <rect class="cursor-line" x="0" y="-48" width="4" height="52" rx="2" fill="url(#cosmicGradNavbar)" filter="url(#neonGlowNavbar)" />
  </g>
</svg>