# Worker vLLM para Qwen/Qwen2.5-7B-Instruct-AWQ -segundo modelo generativo de
# repuesto para T4 (ver Dockerfile). Puertos asignados: qwen3.5 = 8007,
# nemotron = 8008, qwen3.8 = 8009, gte-qwen2-embed = 8010,
# qwen2.5-7b-instruct-awq = 8011.
services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: sooniverse/vllm-qwen2.5-7b-instruct-awq:v1.0.0
    container_name: vllm-qwen25-7b-awq
    runtime: nvidia
    environment:
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - PORT=${PORT:-8011}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-16384}
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS:-8192}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.90}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS:-8}
      - ENFORCE_EAGER=${ENFORCE_EAGER:-1}
      - DTYPE=${DTYPE:-half}
      - KV_CACHE_DTYPE=${KV_CACHE_DTYPE:-auto}
      - TENSOR_PARALLEL_SIZE=${TENSOR_PARALLEL_SIZE:-1}
      - QUANTIZATION=${QUANTIZATION:-}
      - ENABLE_TOOL_CALLING=${ENABLE_TOOL_CALLING:-0}
      - TOOL_CALL_PARSER=${TOOL_CALL_PARSER:-}
      - VLLM_ATTENTION_BACKEND=${VLLM_ATTENTION_BACKEND:-}
      # Encontrado en la prueba local (Fase 3): el sampler de FlashInfer
      # intenta compilar un kernel JIT en el primer arranque si no hay un
      # cubin precompilado para la arquitectura de la GPU -y esta imagen
      # (base 'runtime', no 'devel') no trae nvcc, así que revienta con
      # "Could not find nvcc" en vez de solo ser más lenta. Mismo fix ya
      # aplicado en qwen3.5/qwen3.8; T4 (Turing) es justo el caso con más
      # probabilidad de no tener cubin precompilado, así que importa aquí.
      - VLLM_USE_FLASHINFER_SAMPLER=0
      - CUDA_MODULE_LOADING=LAZY
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - PYTHONUNBUFFERED=1
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "${PORT:-8011}:${PORT:-8011}"
    volumes:
      - ./hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
