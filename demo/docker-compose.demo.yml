# ==============================================================================
# Sooniverse Demo - Gateway (chat + panel + LiteLLM) contra proveedor externo
# ==============================================================================
# Espejo reducido de docker_images/gateway/docker-compose.yml (generado por
# scripts/render_gateway_stack.py) pensado para un VPS COMPARTIDO:
#   - Sin workers vLLM: LiteLLM enruta a DeepInfra (demo/generated/litellm_config.yaml).
#   - Nombre de proyecto, red, volúmenes, contenedores e imágenes con prefijo
#     'sooniverse-demo' para no chocar con nada de lo que ya corre en el VPS.
#   - NO publica 80/443: solo nginx en 127.0.0.1:${DEMO_HTTP_PORT}; el Nginx
#     del host termina TLS y hace proxy aquí.
#   - PostgreSQL propio dentro del stack (sin puertos publicados).
#
# No lo levantes a mano: usa ./demo/deploy_demo.sh (orden de arranque, esquema
# de BD y key virtual del chat). Ver demo/DESPLIEGUE_DEMO.md.
# ==============================================================================

name: sooniverse-demo

x-db-env: &db-env
  DB_NAME: ${DB_NAME:-sooniverse}
  DB_USER: ${DB_USER:-sooniverse}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en demo/.env.demo}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}

services:

  postgres:
    image: postgres:16-alpine
    container_name: sooniverse-demo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sooniverse}
      POSTGRES_USER: ${DB_USER:-sooniverse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en demo/.env.demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sooniverse} -d ${DB_NAME:-sooniverse}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [demo_net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sooniverse-demo-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 192m
    networks: [demo_net]
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: sooniverse-demo-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      # Esquema propio 'litellm' (ver "CONVIVENCIA CON LITELLM" en database/001_init_schema.sql).
      DATABASE_URL: postgresql://${DB_USER:-sooniverse}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-sooniverse}?schema=litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Define LITELLM_MASTER_KEY en demo/.env.demo}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Define LITELLM_SALT_KEY en demo/.env.demo}
      # Credencial del proveedor externo: solo la ve este contenedor.
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:?Define DEEPINFRA_API_KEY en demo/.env.demo}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORE_MODEL_IN_DB: "True"
      LITELLM_LOG: "ERROR"
      DISABLE_SCHEMA_UPDATE: "False"
    volumes:
      - ./generated/litellm_config.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    networks: [demo_net]
    restart: unless-stopped

  open-webui:
    build:
      context: ../docker_images/openwebui
      dockerfile: Dockerfile
    image: sooniverse-demo/open-webui:0.11.0
    container_name: sooniverse-demo-webui
    environment:
      <<: *db-env
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      # Key VIRTUAL de la interfaz de chat (la crea ensure_openwebui_key.py vía
      # deploy_demo.sh antes de arrancar este servicio): así su consumo se
      # atribuye en el panel como "Interfaz Web" y no como "(sin registro)".
      OPENAI_API_KEY: ${OPENWEBUI_LITELLM_API_KEY:-${LITELLM_MASTER_KEY}}
      WEBUI_NAME: "Sooniverse AI"
      WEBUI_AUTH: "True"
      ENABLE_SIGNUP: ${WEBUI_SIGNUP:-false}
      ENABLE_OLLAMA_API: "False"
      WEBUI_SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en demo/.env.demo}
      DEFAULT_USER_ROLE: "user"
      WEBUI_URL: ${GATEWAY_PUBLIC_URL:-}
      # SSO por cabecera de confianza (login único en el panel Django, nginx
      # 'auth_request'). Seguro porque 8080 nunca se publica fuera de la red.
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Sooniverse-Email
      WEBUI_AUTH_TRUSTED_NAME_HEADER: X-Sooniverse-Name
      ENABLE_LOGIN_FORM: "False"
      SOONIVERSE_PANEL_URL: ${SOONIVERSE_PANEL_URL:-/panel/}
      DATABASE_URL: postgresql://${DB_USER:-sooniverse}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-sooniverse}?options=-csearch_path%3Dsooniverse
      DATABASE_SCHEMA: sooniverse
      # Los modelos de DeepInfra soportan json_object: tareas automáticas activas.
      ENABLE_TITLE_GENERATION: "true"
      ENABLE_TAGS_GENERATION: "true"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "true"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "true"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
    volumes:
      - webui_data:/app/backend/data
    expose:
      - "8080"
    depends_on:
      - litellm
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 2g
    networks: [demo_net]
    restart: unless-stopped

  openwebui-bootstrap:
    image: sooniverse-demo/open-webui:0.11.0
    container_name: sooniverse-demo-webui-bootstrap
    entrypoint: ["python3", "-m", "sooniverse.bootstrap_models"]
    environment:
      <<: *db-env
      DATABASE_URL: postgresql://${DB_USER:-sooniverse}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-sooniverse}?options=-csearch_path%3Dsooniverse
      DATABASE_SCHEMA: sooniverse
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      CLIENTE_ID: ${CLIENTE_ID:-demo}
      ENTORNO: ${ENTORNO:-prod}
      OPENWEBUI_BASE_URL: http://open-webui:8080
      OPENWEBUI_BOOTSTRAP_EMAIL: ${OPENWEBUI_BOOTSTRAP_EMAIL:-bootstrap@sooniverse.internal}
      OPENWEBUI_BOOTSTRAP_PASSWORD: ${OPENWEBUI_BOOTSTRAP_PASSWORD:?Define OPENWEBUI_BOOTSTRAP_PASSWORD en demo/.env.demo}
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Sooniverse-Email
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    volumes:
      - ./generated/litellm_config.yaml:/app/litellm_config.yaml:ro
    depends_on:
      open-webui:
        condition: service_healthy
    networks: [demo_net]
    restart: "no"
    profiles: ["bootstrap"]

  metrics:
    build:
      context: ../django_metrics
      dockerfile: Dockerfile
    image: sooniverse-demo/metrics-panel:1.0.0
    container_name: sooniverse-demo-metrics
    environment:
      <<: *db-env
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      HTTPS_ACTIVO: ${HTTPS_ACTIVO:-false}
      FORCE_SCRIPT_NAME: ${FORCE_SCRIPT_NAME:-/panel}
      LITELLM_BASE_URL: http://litellm:4000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CHAT_URL: ${CHAT_URL:-/}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      CLIENTE_ID: ${CLIENTE_ID:-demo}
      ENTORNO: ${ENTORNO:-prod}
      # Sin workers propios ni AWS: VITRINA simula el pool como sano y oculta
      # las acciones de EC2/SSH (ver django_metrics/sooniverse_panel/settings.py).
      VITRINA: ${VITRINA:-true}
      TIME_ZONE: ${TIME_ZONE:-America/Bogota}
      METRICS_COSTE_HORA_USD: ${METRICS_COSTE_HORA_USD:-0}
      METRICS_REFRESH_INTERVAL: ${METRICS_REFRESH_INTERVAL:-60}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@sooniverse.co}
    volumes:
      - panel_static:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    networks: [demo_net]
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: sooniverse-demo-proxy
    volumes:
      - ./generated/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - panel_static:/usr/share/nginx/panel-static:ro
    # ÚNICA superficie del stack, y solo en loopback: el Nginx del host es
    # quien la expone a Internet bajo DEMO_DOMAIN (con TLS).
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-8088}:80"
    depends_on:
      - open-webui
      - litellm
      - metrics
    mem_limit: 128m
    networks: [demo_net]
    restart: unless-stopped

  # One-shot: render, esquema de BD y key virtual del chat (deploy_demo.sh).
  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    image: sooniverse-demo/tools:1.0.0
    # Mismo uid/gid que quien corre deploy_demo.sh: lo que escribe (generated/,
    # el append de la key del chat en .env.demo) no queda como root.
    user: "${DEMO_UID:-0}:${DEMO_GID:-0}"
    volumes:
      - ..:/repo
    working_dir: /repo
    networks: [demo_net]
    restart: "no"
    profiles: ["tools"]

networks:
  demo_net:
    driver: bridge

volumes:
  pgdata:
  webui_data:
  panel_static:
