# ==============================================================================
# Sooniverse Infrastructure - Central Configuration (Source of Truth)
# ==============================================================================
# FASE 1: Gateway (LiteLLM + Open WebUI + Django Metrics) + Workers vLLM en VPC
# ==============================================================================

# 1. Datos del Cliente y Entorno
cliente:
  id: "acme"                  # Identificador único del cliente (ej. acme, globex)
  entorno: "prod"             # Propósito de la infraestructura: prod | dev
  modo: "byoc"                # Modalidad de despliegue: byoc (Bring Your Own Cloud) | hosted

# 2. Variables de Red y Aislamiento
red_y_aislamiento:
  region: "us-east-1"         # Región por defecto de la nube
  # Perfil de ~/.aws/credentials o ~/.aws/config a usar para ESTE cliente
  # (aislamiento de credenciales multi-cliente, Fase 6). null = perfil por
  # defecto de la cuenta/entorno (AWS_PROFILE, o credenciales del proceso).
  aws_profile: null
  image_id: "ami-0d001f8052688dc45"  # AMI personalizada para los workers GPU (opcional)
  # gestion_red: auto -> AwsNetworkManager crea y destruye la VPC/subredes/NAT/SGs.
  #              existente -> comportamiento legado: la VPC/SGs ya existen y se
  #              referencian por nombre (compatibilidad hacia atrás).
  gestion_red: "auto"
  vpc_name: null               # auto: se autogenera como sooniverse-<cliente>-<entorno>-vpc
  vpc_id: null                 # informativo/auditoría; lo rellena AwsNetworkManager tras provision()
  subnet_id: null              # Subred específica (opcional, solo modo 'existente')
  vpc_cidr: "10.0.0.0/16"
  azs: 1                        # nº de Availability Zones; >1 solo si necesitas HA real
  subredes:
    publicas: null              # null = cálculo automático determinista a partir de vpc_cidr
    privadas: null
  nat_gateway:
    modo: "single"               # single | per-az | none
    timeout_segundos: 300
  vpc_endpoints:
    s3: true                    # gateway endpoint, gratis
    ecr: false                  # interface endpoints, tienen coste
  # Cuando es true, los workers se aprovisionan SIN IP pública y su acceso SSH
  # se tuneliza a través del Nodo Gateway (bastion). Requiere NAT Gateway o
  # VPC Endpoints en la subred privada para que los workers alcancen internet.
  workers_en_subred_privada: true
  # CIDR autorizado a alcanzar los puertos públicos del Gateway.
  # "0.0.0.0/0" expone a internet; restringir en producción real.
  cidr_permitido_gateway: "0.0.0.0/0"
  cidr_admin_ssh: "0.0.0.0/0"   # CIDR autorizado a SSH (puerto 22) al Gateway. Restringir en producción.
  # En modo 'auto' estos dos quedan en null: los crea y nombra AwsNetworkManager.
  # En modo 'existente' deben apuntar a Security Groups ya creados a mano.
  security_group_workers: null
  security_group_gateway: null
  tags_obligatorios:
    cliente_id: "acme"
    modo: "byoc"
    entorno: "prod"
    gestionado_por: "sooniverse"

# 3. Nodo Gateway (única puerta de entrada pública del clúster)
gateway:
  habilitado: true
  tipo_instancia: "t3.large"  # Instancia CPU-only: no requiere GPU
  disk_size: 100              # GB de disco para imágenes Docker y volúmenes
  # false (recomendado) -> el SG del gateway solo abre 80/443; litellm/open-webui/
  # metrics quedan detrás de nginx. true -> además abre 4000/8000/8080 al CIDR
  # público (usar solo en dev/depuración).
  exponer_puertos_directos: false
  # Puertos directos adicionales SOLO si exponer_puertos_directos: true (dev/
  # depuración). Con el default (false), nginx es la única puerta pública:
  # 80 siempre, 443 si tls.habilitado.
  puertos_publicos:
    - 4000                    # LiteLLM Proxy (API OpenAI-compatible)
    - 8080                    # Open WebUI directo
    - 8000                    # Django Metrics & API Keys panel
  # Estrategia de balanceo de LiteLLM sobre los workers vLLM.
  # latency-based-routing | simple-shuffle (round-robin ponderado) | least-busy | usage-based-routing
  load_balancing_strategy: "latency-based-routing"
  tls:
    habilitado: false
    modo: "self-signed"        # self-signed (implementado) | letsencrypt | acm (hooks documentados, no implementados)
    dominio: null              # requerido si habilitado: true (usado como CN del cert y server_name de nginx)
  litellm:
    master_key_env: "LITELLM_MASTER_KEY"   # Nombre de la var de entorno con la master key
    num_retries: 2
    request_timeout: 600
    cooldown_time: 30                      # Segundos que un worker caído sale del pool
    allowed_fails: 2
  open_webui:
    habilitado: true
    signup_habilitado: false               # Bloquea auto-registro público
    # Tareas automáticas que dependen de response_format=json_object (título,
    # tags, autocompletado, follow-up, consultas de RAG/búsqueda) y el
    # intérprete de código (depende de tool calling real). Cada una:
    #   segun_capacidades (default) -> las activa scripts/test_model_capabilities.py
    #     según lo que el modelo desplegado soporte de verdad (fail-closed:
    #     un sondeo inconcluso las deja apagadas). Ver sooniverse.model_capability.
    #   activado | desactivado -> fuerza el valor sin importar el sondeo.
    tareas_automaticas: "segun_capacidades"
    code_interpreter: "segun_capacidades"
  django_metrics:
    habilitado: true
    puerto: 8000
    # Cada cuántos segundos el job de ingesta refresca métricas desde LiteLLM
    metrics_refresh_interval: 300

# 4. Automatización de Base de Datos
base_de_datos:
  # Interruptor pedido en el contrato: determina si `scripts/db_setup.py` corre
  # automáticamente durante el despliegue de la infraestructura.
  #   true  -> el Gateway ingesta database/*.sql (orden lexicográfico) al arrancar
  #   false -> se omite; el operador debe ejecutar `python scripts/db_setup.py` a mano
  AUTO_INIT_DB: true
  # Ejecuta también el ETL de LiteLLM + recálculo de rollups tras aplicar el esquema
  auto_refresh_metrics: true
  # Directorio (relativo al repo) con los .sql a ingestar en orden lexicográfico.
  # Para forzar un único archivo (comportamiento legado), usa `db_setup.py --sql <archivo>`.
  schema_dir: "database"

# 5. Perfil de Cargas de Trabajo (Multi-modelo, Multi-nodo)
workloads:
  - id: "qwen3-5-llm"
    modelo: "qwen3.5"
    hf_repo: "cyankiwi/Qwen3.5-2B-AWQ-4bit"
    tipo_tarea: "llm-texto"     # Tipo de tarea: llm-texto | embeddings
    accelerator: "L4"           # Especificación de GPU (ej. T4, A10g, L4, A100)
    cantidad_gpus: 1            # Número de GPUs por nodo
    replicas: 1                 # Nodos worker a desplegar para este modelo (balanceados por LiteLLM)
    tipo_instancia: "g6.xlarge" # Tipo de instancia en AWS (opcional u override)
    puerto: 8007                # Puerto de la API expuesto por el worker (solo red interna)
    # Nombre público del modelo expuesto por LiteLLM al cliente final
    nombre_publico: "sooniverse-qwen3.5"
    peso_balanceo: 1            # Peso relativo en el pool de LiteLLM
    asignacion_fraccional:
      habilitado: true
      gpu_memory_utilization: 0.95 # Asignación de VRAM fraccional (0.0 - 1.0)
      max_model_len: 16384
    # Capacidades reales de ESTE modelo/checkpoint. El generador solo activa en
    # vLLM las banderas correspondientes si aquí están en true -evita mandarle
    # tool_choice="auto" o imágenes a un modelo que nunca las va a soportar.
    # scripts/test_model_capabilities.py sondea el modelo ya desplegado y avisa
    # si lo declarado acá no coincide con lo que el modelo responde de verdad.
    capacidades:
      vision: true               # Este checkpoint de Qwen3.5 sí tiene torre de visión.
      tool_calling: false        # Sin --tool-call-parser confirmado para este checkpoint: no anunciarlo.
      tool_call_parser: null     # ej. "hermes" o "qwen" -requerido si tool_calling: true.
