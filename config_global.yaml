# ==============================================================================
# Sooniverse Infrastructure - Central Configuration (Source of Truth)
# ==============================================================================

# 1. Datos del Cliente y Entorno
cliente:
  id: "acme"                  # Identificador único del cliente (ej. acme, globex)
  entorno: "prod"             # Propósito de la infraestructura: prod | dev
  modo: "byoc"                # Modalidad de despliegue: byoc (Bring Your Own Cloud) | hosted

# 2. Variables de Red y Aislamiento
red_y_aislamiento:
  region: "us-east-1"         # Región por defecto de la nube
  image_id: "ami-0d001f8052688dc45"  # ID de la AMI personalizada (opcional/dinámica)
  vpc_id: null                # ID de VPC dedicada (ej. vpc-0a1b2c3d4e5f67890). Usar null para VPC por defecto
  subnet_id: null             # Subred específica (opcional)
  tags_obligatorios:
    cliente_id: "acme"
    modo: "byoc"
    entorno: "prod"
    gestionado_por: "sooniverse"

# 3. Perfil de Cargas de Trabajo (Multi-modelo)
workloads:
  - id: "qwen3-5-llm"
    modelo: "qwen3.5"
    hf_repo: "cyankiwi/Qwen3.5-2B-AWQ-4bit"
    tipo_tarea: "llm-texto"    # Tipo de tarea: llm-texto | embeddings
    accelerator: "L4"          # Especificación de GPU (ej. T4, A10g, A100)
    cantidad_gpus: 1           # Número de GPUs requeridas
    tipo_instancia: "g6.xlarge" # Tipo de instancia en AWS (opcional u override)
    puerto: 8007               # Puerto de la API expuesto por la carga
    asignacion_fraccional:
      habilitado: true
      gpu_memory_utilization: 0.95 # Asignación de VRAM fraccional (0.0 - 1.0)
      max_model_len: 16384
