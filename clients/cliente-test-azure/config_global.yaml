# ==============================================================================
# CLIENTE DE PRUEBA -- AZURE, modo "hosted" (cuenta propia de Sooniverse)
# ==============================================================================
# Contraparte Azure de clients/cliente-test/ (AWS, byoc) -mismo propósito:
# despliegue real de prueba, no una plantilla ("_ejemplo*"). Región y familia
# de GPU elegidas para que coincidan con la cuota solicitada en
# scripts/azure_check_gpu_quota.py (ver README.md §7.1.1):
#   python scripts/azure_check_gpu_quota.py --request-increase southcentralus "Standard NCASv3_T4 Family" 16
#   python scripts/azure_check_gpu_quota.py --request-increase southcentralus StandardNVADSA10v5Family 16
#
# Esta primera prueba usa SOLO T4 (workloads[].accelerator abajo) -A10 queda
# con cuota pedida para una segunda prueba posterior, no se usa todavía.
#
# Dominio: 'gateway.dominio.habilitado' queda en false a propósito. El generador
# lo bloquea explícitamente en Azure (ConfigValidator._validate_dominio) porque
# el dominio propio + Let's Encrypt + IP pública persistente todavía no está
# implementado para esta nube (solo AWS) -ver scripts/azure_network.py. El
# bloque completo se deja aquí, con la estructura correcta y un ejemplo
# comentado, listo para activarlo el día que se implemente esa pieza.
#
# Comandos (idénticos a AWS, la nube se decide por 'red_y_aislamiento.cloud'):
#   python scripts/generate_infra.py --config clients/cliente-test-azure/config_global.yaml
#   python scripts/generate_infra.py --config clients/cliente-test-azure/config_global.yaml --run --dry-run
# ==============================================================================

# 1. Datos del Cliente y Entorno
cliente:
  id: "cliente-test-azure"     # ÚNICO por cliente: minúsculas, [a-z0-9-], máx 20 caracteres.
  entorno: "dev"                 # prod | dev
  modo: "hosted"                 # Azure BYOC no implementado todavía -ver docs/05_MULTICLIENTE.md (AWS)

# 2. Variables de Red y Aislamiento
red_y_aislamiento:
  cloud: "azure"                  # NUEVO: aws (default) | azure
  region: "southcentralus"         # slug de Azure -verificado sin restricción de suscripción para T4/A10 (ver README §7.1.1)
  aws_profile: null                 # sin efecto con cloud: azure (ver .env.example AZURE_*)
  image_id: "Canonical:0001-com-ubuntu-server-jammy:22_04-lts:latest"
  gestion_red: "auto"                # único modo soportado en Azure por ahora
  vpc_name: null
  vpc_id: null
  subnet_id: null
  vpc_cidr: "10.30.0.0/16"           # distinto al de otros clientes activos (root=10.0.0.0/16, cliente-test=10.10.0.0/16, _ejemplo_azure=10.20.0.0/16)
  azs: 1                              # Azure no tiene subredes zonales; >1 se ignora con un WARNING
  subredes:
    publicas: null
    privadas: null
  nat_gateway:
    modo: "single"                   # single | none (Azure no tiene "per-az")
    timeout_segundos: 300
  vpc_endpoints:
    s3: true                         # sin efecto en Azure (no hay VPC Endpoint tipo S3)
    ecr: false
  workers_en_subred_privada: true
  cidr_permitido_gateway: "0.0.0.0/0"
  cidr_admin_ssh: "0.0.0.0/0"         # Restringe a la IP/VPN del operador en producción real.
  security_group_workers: null
  security_group_gateway: null
  tags_obligatorios:
    cliente_id: "cliente-test-azure"
    modo: "hosted"
    entorno: "dev"
    gestionado_por: "sooniverse"

# 3. Nodo Gateway
gateway:
  habilitado: true
  tipo_instancia: "Standard_D2as_v5"   # SKU de Azure (CPU-only), no "t4g.large"
  disk_size: 100
  exponer_puertos_directos: false
  puertos_publicos:
    - 4000
    - 8080
    - 8000
  load_balancing_strategy: "latency-based-routing"
  # Dominio propio + TLS real: NO implementado para Azure en esta versión
  # (ver ConfigValidator._validate_dominio en scripts/generate_infra.py).
  # Bloque completo dejado listo/inactivo -activar 'habilitado' una vez
  # exista el equivalente Azure de la EIP persistente + certbot de AWS.
  dominio:
    habilitado: false
    seleccionado: null
    disponibles: []
      # - nombre: "ia-azure.sooniverse.co"
      #   email_acme: "contacto@sooniverse.co"
    staging: false
    redirigir_http: true
    eip_persistente: true
    esperar_dns_segundos: 300
  tls:
    habilitado: false                 # self-signed SÍ funciona hoy en Azure; queda apagado por decisión explícita para esta prueba
    modo: "self-signed"
    dominio: null
  litellm:
    master_key_env: "LITELLM_MASTER_KEY"
    num_retries: 2
    request_timeout: 600
    cooldown_time: 30
    allowed_fails: 2
  open_webui:
    habilitado: true
    signup_habilitado: false
    tareas_automaticas: "segun_capacidades"
    code_interpreter: "segun_capacidades"
  django_metrics:
    habilitado: true
    puerto: 8000
    metrics_refresh_interval: 300

# 4. Automatización de Base de Datos
base_de_datos:
  AUTO_INIT_DB: true
  auto_refresh_metrics: true
  schema_dir: "database"

# 5. Perfil de Cargas de Trabajo -- SOLO T4 para esta primera prueba Azure.
#    Cuota pedida: familia "Standard NCASv3_T4 Family", southcentralus, 16 vCPUs
#    (ver scripts/azure_check_gpu_quota.py --quota southcentralus para confirmar
#    que ya fue aprobada antes de intentar un despliegue real).
workloads:
  - id: "qwen3-5-llm"
    modelo: "qwen3.5"
    hf_repo: "cyankiwi/Qwen3.5-2B-AWQ-4bit"
    tipo_tarea: "llm-texto"
    accelerator: "T4"                       # SKU de Azure real (no hay L4/L40S -ver README §7.1.1)
    cantidad_gpus: 1
    replicas: 1
    tipo_instancia: "Standard_NC4as_T4_v3"   # 4 vCPU, 1x T4 -tamaño más chico de esta familia
    puerto: 8007
    nombre_publico: "sooniverse-qwen3.5"
    peso_balanceo: 1
    asignacion_fraccional:
      habilitado: true
      gpu_memory_utilization: 0.95
      max_model_len: 16384
    # T4 = Turing (SM75): sin FlashAttention-2 (exige SM80+, era el default
    # hardcodeado del compose -ver docker_images/qwen3.5/docker-compose.yml)
    # ni bfloat16. TRITON_ATTN es el backend de atención que vLLM 0.24.0 sí
    # soporta en Turing ('XFORMERS' fue retirado del motor V1 -verificado
    # contra el registro real de backends en la prueba local de Fase 3).
    # DTYPE=half ya es el default del compose, se deja explícito aquí por
    # autodocumentación.
    runtime_vllm:
      attention_backend: "TRITON_ATTN"
      dtype: "half"
    # '--attention-backend' solo controla la atención del LM: la prueba local
    # mostró que la torre de visión (ViT) de este checkpoint sigue forzando
    # FLASH_ATTN por su cuenta ("Using backend AttentionBackendEnum.FLASH_ATTN
    # for vit attention" / mm_encoder_attention.py) sin importar este flag.
    # En T4 eso reventaría igual que el LM sin el fix. Vision no hace falta
    # para la prueba de balanceador multi-modelo -se desactiva para no
    # heredar ese riesgo sin verificar.
    capacidades:
      vision: false
