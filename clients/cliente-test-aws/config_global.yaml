# ==============================================================================
# CLIENTE DE PRUEBA -- AWS, modo "hosted" (cuenta propia de Sooniverse)
# ==============================================================================
# Contraparte AWS de clients/cliente-test-azure/ (Azure, hosted) -mismo
# propósito: confirmar que el balanceador multi-modelo + dominio propio
# funcionan también en AWS, ya con ambos flujos probados en Azure primero.
#
# 'red_y_aislamiento.aws_profile: null' -a propósito, a diferencia de
# clients/cliente-test/ (BYOC, despliega en la cuenta AWS de un cliente real
# vía rol asumido): este cliente vive en la cuenta PROPIA de Sooniverse, con
# las credenciales por defecto de ~/.aws/credentials, para no tocar ninguna
# cuenta de cliente real con una prueba interna.
#
# Dominio: 'ia.sooniverse.co' (email_acme: contacto@sooniverse.co) -reservado
# para AWS desde el plan original (az.sooniverse.co ya se usa en Azure).
# 'staging: true' para la primera emisión (mismo criterio que Azure: evita
# quemar el límite de 5 fallos/hora de Let's Encrypt en el primer intento);
# se pasa a 'staging: false' una vez confirmado el flujo end-to-end.
#
# Multi-modelo: mismos dos checkpoints ya validados en Azure
# (qwen3.5 2B AWQ + qwen2.5-7b-instruct-awq), en la imagen ORIGINAL
# 'docker_images/qwen3.5/' (no la copia '-t4', que existe solo para Turing;
# L4/g6.xlarge es Ampere -SM86- y sí soporta FlashAttention-2 nativo, así que
# 'runtime_vllm.attention_backend' no hace falta aquí).
#
# Comandos:
#   python scripts/generate_infra.py --config clients/cliente-test-aws/config_global.yaml --run
#   python scripts/destroy_infra.py  --config clients/cliente-test-aws/config_global.yaml --dry-run
#   python scripts/verify_deployment.py --config clients/cliente-test-aws/config_global.yaml
# ==============================================================================

# 1. Datos del Cliente y Entorno
cliente:
  id: "cliente-test-aws"       # ÚNICO por cliente: minúsculas, [a-z0-9-], máx 20 caracteres.
  entorno: "dev"                 # prod | dev
  modo: "hosted"                 # cuenta propia de Sooniverse (ver comentario arriba)

# 2. Variables de Red y Aislamiento
red_y_aislamiento:
  region: "us-east-1"
  aws_profile: null                # cuenta por defecto de Sooniverse -no BYOC
  # AMI ya confirmada con Docker + drivers NVIDIA preinstalados en una
  # corrida real anterior de este mismo repo (a diferencia de Azure, que
  # partió de una imagen Ubuntu genérica y necesitó instalar todo desde cero).
  image_id: "ami-0d001f8052688dc45"
  gestion_red: "auto"
  vpc_name: null
  vpc_id: null
  subnet_id: null
  vpc_cidr: "10.40.0.0/16"          # distinto a cualquier otro cliente activo
  # CORREGIDO: 'azs: 1' confirmado en un despliegue real como insuficiente
  # -g6.xlarge sufrió InsufficientInstanceCapacity de forma consistente y
  # repetida en la única zona disponible (us-east-1a), mientras el propio
  # mensaje de error de AWS confirmaba capacidad libre en us-east-1b/c/d/f.
  # Con azs>1 la subred privada existe en varias zonas y SkyPilot sí puede
  # saltar a una con capacidad real en vez de reintentar para siempre en la
  # misma zona sin salida.
  azs: 3
  subredes:
    publicas: null
    privadas: null
  nat_gateway:
    modo: "single"
    timeout_segundos: 300
  vpc_endpoints:
    s3: true
    ecr: false
  workers_en_subred_privada: true
  cidr_permitido_gateway: "0.0.0.0/0"
  cidr_admin_ssh: "0.0.0.0/0"       # Restringe a la IP/VPN del operador en producción real.
  security_group_workers: null
  security_group_gateway: null
  tags_obligatorios:
    cliente_id: "cliente-test-aws"
    modo: "hosted"
    entorno: "dev"
    gestionado_por: "sooniverse"

# 3. Nodo Gateway
gateway:
  habilitado: true
  tipo_instancia: "t4g.large"      # CPU-only (Graviton) -el Gateway no necesita GPU.
  disk_size: 100
  exponer_puertos_directos: false
  puertos_publicos:
    - 4000
    - 8080
    - 8000
  load_balancing_strategy: "latency-based-routing"
  dominio:
    habilitado: true
    seleccionado: "ia.sooniverse.co"
    disponibles:
      - nombre: "ia.sooniverse.co"
        email_acme: "contacto@sooniverse.co"
    staging: false               # flujo confirmado con staging; ya se emite el cert real
    redirigir_http: true
    eip_persistente: true
    esperar_dns_segundos: 300
  tls:
    habilitado: false               # derivado automáticamente a true/letsencrypt por load_config() cuando dominio.habilitado=true
    modo: "self-signed"
    dominio: null
  litellm:
    master_key_env: "LITELLM_MASTER_KEY"
    num_retries: 2
    request_timeout: 600
    cooldown_time: 30
    allowed_fails: 2
  open_webui:
    habilitado: true
    signup_habilitado: false
    tareas_automaticas: "segun_capacidades"
    code_interpreter: "segun_capacidades"
  django_metrics:
    habilitado: true
    puerto: 8000
    metrics_refresh_interval: 300

# 4. Automatización de Base de Datos
base_de_datos:
  AUTO_INIT_DB: true
  auto_refresh_metrics: true
  schema_dir: "database"

# 5. Perfil de Cargas de Trabajo -- multi-modelo en L4 (2x g6.xlarge)
workloads:
  - id: "qwen3-5-llm"
    modelo: "qwen3.5"
    hf_repo: "cyankiwi/Qwen3.5-2B-AWQ-4bit"
    tipo_tarea: "llm-texto"
    accelerator: "L4"
    cantidad_gpus: 1
    replicas: 1
    tipo_instancia: "g6.xlarge"
    puerto: 8007
    nombre_publico: "sooniverse-qwen3.5"
    peso_balanceo: 1
    asignacion_fraccional:
      habilitado: true
      gpu_memory_utilization: 0.95
      max_model_len: 16384
    capacidades:
      vision: false                 # mismo criterio que en Azure: no verificado, se desactiva para no anunciar una capacidad no probada aquí

  - id: "qwen25-7b-awq-llm"
    modelo: "qwen2.5-7b-instruct-awq"
    hf_repo: "Qwen/Qwen2.5-7B-Instruct-AWQ"
    tipo_tarea: "llm-texto"
    accelerator: "L4"
    cantidad_gpus: 1
    replicas: 1
    tipo_instancia: "g6.xlarge"
    puerto: 8011
    nombre_publico: "sooniverse-qwen2.5-7b"
    peso_balanceo: 1
    asignacion_fraccional:
      habilitado: true
      gpu_memory_utilization: 0.90
      max_model_len: 16384
    capacidades:
      vision: false
